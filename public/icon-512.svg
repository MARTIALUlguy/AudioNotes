<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#1a1a2e" rx="100"/>
  
  <!-- Microphone Icon -->
  <g transform="translate(256, 256)">
    <!-- Mic body -->
    <rect x="-50" y="-80" width="100" height="130" rx="50" fill="#00d4ff" opacity="0.9"/>
    
    <!-- Mic sound waves -->
    <path d="M -120 0 A 120 120 0 0 1 -90 -80" stroke="#00d4ff" stroke-width="10" fill="none" opacity="0.6"/>
    <path d="M 90 -80 A 120 120 0 0 1 120 0" stroke="#00d4ff" stroke-width="10" fill="none" opacity="0.6"/>
    
    <!-- Additional wave -->
    <path d="M -150 0 A 150 150 0 0 1 -110 -110" stroke="#00d4ff" stroke-width="8" fill="none" opacity="0.4"/>
    <path d="M 110 -110 A 150 150 0 0 1 150 0" stroke="#00d4ff" stroke-width="8" fill="none" opacity="0.4"/>
    
    <!-- Stand -->
    <line x1="-35" y1="50" x2="-35" y2="90" stroke="#00d4ff" stroke-width="10" opacity="0.8"/>
    <line x1="0" y1="50" x2="0" y2="90" stroke="#00d4ff" stroke-width="10" opacity="0.8"/>
    <line x1="35" y1="50" x2="35" y2="90" stroke="#00d4ff" stroke-width="10" opacity="0.8"/>
    
    <!-- Base -->
    <rect x="-50" y="90" width="100" height="20" rx="10" fill="#00d4ff" opacity="0.8"/>
  </g>
</svg>
